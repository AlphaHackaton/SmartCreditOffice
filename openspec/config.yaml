schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: веб-кредитный конвейер для МСБ (ИП/ООО), хакатон Альфа-Будущее 2026, дедлайн 26.10.2026 18:00 МСК.
  Стек: FastAPI + SQLAlchemy + PostgreSQL (backend/), React + TS + Vite + Alfa Core Components (frontend/), docker-compose.
  Источник требований: SPEC_FOR_AGENT.md (§2 запреты, §4 сценарий, §5 Q&A экспертов, §6 чек-лист сдачи).
  Сквозной сценарий: Потребность → Заявка → Скоринг (моки ФНС/БКИ/выручка) → Решение (APPROVED/COUNTER_OFFER/REJECTED) → Подписание в UI → «Кредит выдан».
  Запреты: платные/закрытые модели в рантайме, SMS/email, мобильные приложения, тяжёлые модели в docker, реальные интеграции.

rules:
  proposal:
    - Указывай, какой пункт SPEC (§ и номер Q&A) обосновывает изменение.
    - Обязательно раздел «Вне скоупа».
    - Не более 400 слов; приоритет — работающий сквозной сценарий к дедлайну.
  specs:
    - Каждое требование имеет хотя бы один Scenario в формате WHEN/THEN.
    - Внешние системы описываются как моки с детерминированным поведением на синтетических данных.
  design:
    - Описывай изменения API (эндпоинт, схема) и модели данных явно.
    - Для скоринга — таблица факторов, весов и порогов (прозрачность решения).
  tasks:
    - Задачи по 30–90 минут, у каждой — критерий проверки (тест или команда).
    - Последняя задача любого изменения — «Прогнать scripts/check.sh, обновить docs/openapi.json и THIRD_PARTY_NOTICES.md».

operations:
  apply:
    guidance:
      - После каждой задачи читай вывод [harness quick-check]; перед отметкой задачи выполненной вызови harness_check.
      - Не меняй стек и не добавляй сервисы в docker-compose сверх описанного в design.md.
  archive:
    guidance:
      - Перед архивацией убедись, что scripts/check.sh возвращает 0.
