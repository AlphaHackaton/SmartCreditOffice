[project]
name = "backend"
version = "0.1.0"
description = "Умный кредитный кабинет предпринимателя — backend (домен кредитного решения)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.115",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.10",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "hypothesis==6.170.9",
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
strict = true
